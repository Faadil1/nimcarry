<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>NimCarry cinematic opener</title>
<style>
  :root{
    --forest:#183f36;
    --forest-2:#274f45;
    --cream:#f3eadc;
    --paper:#fbf4e7;
    --terracotta:#a94f37;
    --mustard:#c4933f;
    --sky:#9bb5bf;
    --ink:#201d19;
  }
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--forest);font-family:Georgia,"Times New Roman",serif}
  body{position:relative}
  .stage{position:absolute;inset:0;overflow:hidden;background:
    radial-gradient(circle at 68% 32%,rgba(255,255,255,.10),transparent 30%),
    linear-gradient(135deg,#14372f 0 48%,#1d473d 48% 100%)}
  .fabric{position:absolute;inset:-6%;opacity:.48;background:
    repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 4px),
    repeating-linear-gradient(90deg,rgba(0,0,0,.025) 0 1px,transparent 1px 5px);filter:contrast(110%);transform:scale(1.08)}
  .paper-field{position:absolute;left:-5%;top:9%;width:72%;height:88%;background:var(--cream);clip-path:polygon(2% 3%,97% 0,100% 92%,9% 100%,0 63%);box-shadow:0 28px 65px rgba(0,0,0,.28);transform:translateX(-105%) rotate(-2deg);animation:paperIn 1.25s cubic-bezier(.2,.8,.2,1) .12s forwards}
  .paper-field:after{content:"";position:absolute;inset:0;opacity:.22;mix-blend-mode:multiply;background:
    repeating-linear-gradient(17deg,rgba(80,62,46,.08) 0 1px,transparent 1px 7px),
    radial-gradient(circle at 20% 30%,rgba(80,62,46,.12) 0 1px,transparent 1.5px)}
  .thread{position:absolute;left:7%;top:61%;width:74%;height:25%;opacity:0;animation:threadIn .9s ease 2.35s forwards}
  .thread svg{width:100%;height:100%;overflow:visible}
  .thread path{fill:none;stroke:var(--terracotta);stroke-width:9;stroke-linecap:round;stroke-dasharray:18 18;stroke-dashoffset:420;animation:draw 2.3s cubic-bezier(.25,.7,.25,1) 2.45s forwards}
  .route-card,.handoff-card{position:absolute;background:var(--paper);border:1px solid rgba(69,55,42,.32);box-shadow:0 22px 44px rgba(0,0,0,.22);overflow:hidden}
  .handoff-card{left:5.5%;top:15%;width:49%;height:53%;transform:translateY(16px) rotate(-3deg);opacity:0;animation:cardIn .9s cubic-bezier(.2,.75,.2,1) 1.0s forwards}
  .handoff-card img{width:100%;height:100%;object-fit:cover;transform:scale(1.23);animation:macro 4.2s cubic-bezier(.2,.75,.2,1) 1.1s forwards}
  .route-card{right:4.5%;bottom:7%;width:44%;height:52%;transform:translateX(28px) rotate(3deg);opacity:0;animation:cardInRight .9s cubic-bezier(.2,.75,.2,1) 4.25s forwards}
  .route-card img{width:100%;height:100%;object-fit:cover;transform:scale(1.06);animation:routePush 2.3s ease 4.45s forwards}
  .baton{position:absolute;left:14%;top:64%;width:245px;height:58px;border-radius:30px;background:linear-gradient(90deg,#7f5d19 0,#e7c56a 11%,#c4933f 52%,#f0d98c 80%,#8b651e 100%);border:2px solid rgba(69,50,10,.55);box-shadow:0 14px 28px rgba(0,0,0,.30),inset 0 2px 4px rgba(255,255,255,.5);opacity:0;transform:rotate(-6deg) scale(.88);animation:batonAppear .55s ease 2.0s forwards,batonTravel 2.9s cubic-bezier(.2,.8,.2,1) 2.45s forwards}
  .baton:before{content:"1 NIM";position:absolute;inset:0;display:grid;place-items:center;font:800 20px/1 Arial,sans-serif;letter-spacing:.18em;color:#4f3d0e;text-shadow:0 1px rgba(255,255,255,.45)}
  .baton:after{content:"";position:absolute;left:14px;top:13px;width:42px;height:28px;border-radius:16px;background:rgba(255,241,189,.55)}
  .destination{position:absolute;right:18%;top:34%;width:76px;height:76px;border-radius:50% 50% 50% 8px;background:var(--terracotta);transform:rotate(-45deg) scale(.5);opacity:0;box-shadow:0 16px 26px rgba(0,0,0,.25);animation:pinIn .55s cubic-bezier(.2,1.15,.25,1) 5.25s forwards}
  .destination:after{content:"";position:absolute;inset:21px;border-radius:50%;background:var(--paper)}
  .petals{position:absolute;right:9%;top:10%;width:260px;height:180px;opacity:0;transform:scale(.72) rotate(9deg);animation:petalsIn .9s cubic-bezier(.2,.9,.2,1) 6.15s forwards}
  .petal{position:absolute;width:78px;height:118px;border-radius:58% 44% 60% 40%;transform-origin:50% 88%;box-shadow:0 14px 24px rgba(0,0,0,.18)}
  .p1{background:var(--forest-2);left:82px;top:35px;transform:rotate(-7deg)}
  .p2{background:var(--terracotta);left:126px;top:29px;transform:rotate(39deg)}
  .p3{background:var(--mustard);left:44px;top:29px;transform:rotate(-52deg)}
  .final-lockup{position:absolute;left:7.5%;bottom:7%;color:var(--paper);opacity:0;transform:translateY(24px);animation:lockIn .75s cubic-bezier(.2,.8,.2,1) 6.55s forwards}
  .final-lockup .name{font-size:78px;line-height:.9;font-weight:700;letter-spacing:-.04em}
  .final-lockup .tag{margin-top:20px;font-family:Arial,sans-serif;font-size:22px;letter-spacing:.08em;text-transform:uppercase;color:#f3ddab}
  .veil{position:absolute;inset:0;background:var(--forest);opacity:0;pointer-events:none;animation:veilOut .4s ease 7.72s forwards}
  .grain{position:absolute;inset:0;opacity:.10;mix-blend-mode:soft-light;background:
    radial-gradient(circle at 10% 20%,#fff 0 1px,transparent 1.5px),
    radial-gradient(circle at 65% 72%,#000 0 1px,transparent 1.5px);background-size:9px 11px,13px 15px;pointer-events:none}
  @keyframes paperIn{to{transform:translateX(0) rotate(-2deg)}}
  @keyframes cardIn{to{opacity:1;transform:translateY(0) rotate(-3deg)}}
  @keyframes cardInRight{to{opacity:1;transform:translateX(0) rotate(3deg)}}
  @keyframes macro{0%{transform:scale(1.34) translate(-3%,2%)}55%{transform:scale(1.13) translate(2%,-1%)}100%{transform:scale(1.06) translate(0,0)}}
  @keyframes routePush{to{transform:scale(1.0) translate(-1%,-1%)}}
  @keyframes batonAppear{to{opacity:1;transform:rotate(-5deg) scale(1)}}
  @keyframes batonTravel{0%{left:14%;top:64%;transform:rotate(-6deg)}46%{left:40%;top:56%;transform:rotate(4deg)}100%{left:67%;top:43%;transform:rotate(-2deg)}}
  @keyframes threadIn{to{opacity:1}}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes pinIn{to{opacity:1;transform:rotate(-45deg) scale(1)}}
  @keyframes petalsIn{to{opacity:1;transform:scale(1) rotate(0)}}
  @keyframes lockIn{to{opacity:1;transform:translateY(0)}}
  @keyframes veilOut{to{opacity:.16}}
</style>
</head>
<body>
<div class="stage">
  <div class="fabric"></div>
  <div class="paper-field"></div>
  <div class="handoff-card"><img src="../web/craft-baton-handoff.svg" alt="" /></div>
  <div class="thread" aria-hidden="true"><svg viewBox="0 0 1000 250"><path d="M10 204 C190 118,315 235,485 122 S790 38,985 71"/></svg></div>
  <div class="baton" aria-hidden="true"></div>
  <div class="route-card"><img src="../web/craft-human-route.svg" alt="" /></div>
  <div class="destination" aria-hidden="true"></div>
  <div class="petals" aria-hidden="true"><span class="petal p1"></span><span class="petal p2"></span><span class="petal p3"></span></div>
  <div class="final-lockup"><div class="name">NimCarry</div><div class="tag">People move opportunity forward.</div></div>
  <div class="grain"></div>
  <div class="veil"></div>
</div>
</body>
</html>
