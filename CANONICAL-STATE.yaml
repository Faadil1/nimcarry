    - "Approval never advances financial delivery."
    - "Missing client hash is an ambiguous state, not an automatic failure verdict."
    - "Do not resend while an earlier payment could still exist."
    - "Reconciliation is automatic, durable, idempotent, and independent of browser lifetime."
    - "Only independently verified FINAL advances financial state."

