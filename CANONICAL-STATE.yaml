  merged_pr: 125
  merge_sha: 943248664c4c66d628af4623bc2c6250886b74d0
  core_rule: "approval != broadcast != INCLUDED != FINAL"
  external_issue: "https://github.com/nimiq/wallet/issues/314"
  external_root_cause_status: UNCONFIRMED
  evidence_boundary:
    - "One no-hash approval was later independently rediscovered and reached INCLUDED -> FINAL without a resend."
    - "A different no-hash approval terminated fail-closed with no matching broadcast and no custody movement."
    - "A close-before-FINAL run completed through server-owned reconciliation without a manual recheck or second payment."
    - "NimCarry has app-side evidence and screen recordings, but not raw internal Nimiq Pay logs from the original failing approvals."
