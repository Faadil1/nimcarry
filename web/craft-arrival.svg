<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t d">
  <title id="t">The introduction has arrived</title>
  <desc id="d">A mature travel-collage arrival scene with a city postcard, a verified route and people gathered around the destination.</desc>
