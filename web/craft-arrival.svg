    <text x="17" y="40" font-family="Arial,sans-serif" font-size="10" font-weight="900" letter-spacing="1.2" fill="#a94f37">ARRIVED</text>
    <text x="17" y="72" font-family="Iowan Old Style,Georgia,serif" font-size="26" font-weight="700" fill="#183f36">One destination.</text>
    <text x="17" y="102" font-family="Iowan Old Style,Georgia,serif" font-size="26" font-weight="700" fill="#183f36">Reached.</text>
    <text x="17" y="132" font-family="Bradley Hand,Segoe Print,cursive" font-size="15" fill="#5a4b3e">Different people. One human route.</text>
  </g>
