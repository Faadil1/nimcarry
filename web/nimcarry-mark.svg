<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" role="img" aria-labelledby="title desc">
  <title id="title">NimCarry</title>
  <desc id="desc">Three organic paper-cut forms gathered around a shared center, representing people carrying one opportunity toward one destination.</desc>
  <defs>
    <filter id="paper" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7" result="n"/>
      <feComposite in="n" in2="SourceGraphic" operator="in" result="t"/>
      <feBlend in="SourceGraphic" in2="t" mode="multiply"/>
    </filter>
  </defs>
  <rect width="72" height="72" rx="18" fill="#fff8eb"/>
  <g filter="url(#paper)">
    <path d="M34 8c-10 1-17 6-20 15 8 5 15 6 23 1 3-6 2-11-3-16Z" fill="#183f36"/>
    <path d="M10 35c1-9 7-15 16-18 7 6 9 13 5 21-7 5-14 4-21-3Z" fill="#a94f37"/>
    <path d="M38 27c10-4 19-1 25 7-2 11-8 19-18 23-10-3-15-10-14-20 1-5 3-8 7-10Z" fill="#c4933f"/>
  </g>
  <circle cx="35" cy="31" r="3.5" fill="#fff8eb" opacity=".92"/>
</svg>
