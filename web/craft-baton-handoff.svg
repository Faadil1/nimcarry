<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t d">
  <title id="t">A real human handoff of the one NIM custody baton</title>
  <desc id="d">A mature tactile collage showing two hands meeting around a brass-yellow baton, with paper notes explaining the custody rule.</desc>
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#3f2e20" flood-opacity=".18"/></filter>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="2" seed="21" result="n"/><feColorMatrix in="n" type="saturate" values="0" result="m"/><feComponentTransfer in="m"><feFuncA type="table" tableValues="0 .12"/></feComponentTransfer><feBlend in="SourceGraphic" in2="m" mode="multiply"/></filter>
  </defs>
  <rect width="720" height="400" rx="18" fill="#e9ddca"/>
  <path d="M0 0h245l-30 247H0Z" fill="#183f36"/>
  <path d="M720 0H487l27 246h206Z" fill="#d7c6aa"/>
  <path d="M0 310c156-64 305-38 417-68 129-35 194-80 303-61v219H0Z" fill="#c6d0bf"/>
  <g filter="url(#shadow)">
    <path d="M41 39 246 51 234 171 29 160Z" fill="#f8efdf" stroke="#756858" stroke-width="1.5"/>
    <text x="60" y="78" font-family="Iowan Old Style,Georgia,serif" font-size="27" font-weight="700" fill="#183f36">Pass responsibility,</text>
    <text x="60" y="109" font-family="Iowan Old Style,Georgia,serif" font-size="27" font-weight="700" fill="#183f36">not a reward.</text>
    <text x="60" y="140" font-family="Arial,sans-serif" font-size="12" fill="#63584b">The human accepts first. The baton moves later.</text>
  </g>
  <g filter="url(#shadow)">
    <path d="M474 44 678 30 691 161 487 174Z" fill="#f4ead8" stroke="#756858" stroke-width="1.5"/>
    <text x="505" y="74" font-family="Arial,sans-serif" font-size="10" font-weight="900" letter-spacing="1.2" fill="#a94f37">CUSTODY RULE</text>
    <text x="505" y="106" font-family="Iowan Old Style,Georgia,serif" font-size="24" font-weight="700" fill="#211e1a">FINAL first.</text>
    <text x="505" y="135" font-family="Bradley Hand,Segoe Print,cursive" font-size="16" fill="#5c4d3e">Approval is only permission to try.</text>
  </g>
  <path d="M0 153 234 193 202 339 0 306Z" fill="#385e55"/>
  <path d="m234 193 99 66-49 67-97-27Z" fill="#af7659"/>
  <path d="M720 143 500 190l31 149 189-40Z" fill="#6f8697"/>
  <path d="m500 190-101 68 45 69 102-31Z" fill="#d2a078"/>
  <path d="M282 250c18-16 39-18 62-8l48 22-23 43-52-20-46-2c-29-2-45-17-34-33 10-13 25-13 45-2Z" fill="#af7659"/>
  <path d="M443 246c-20-15-40-16-63-6l-48 24 24 42 50-22 45-3c29-4 44-19 31-34-10-12-23-12-39-1Z" fill="#d2a078"/>
  <g transform="translate(263 213) rotate(-3)" filter="url(#shadow)">
    <rect x="0" y="0" width="190" height="44" rx="22" fill="#c4933f" stroke="#705616" stroke-width="3"/>
    <rect x="12" y="10" width="35" height="24" rx="12" fill="#ebca78" opacity=".82"/>
    <path d="M160 8h18v28h-18Z" fill="#183f36" opacity=".92"/>
    <text x="95" y="28" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="900" letter-spacing="2" fill="#4f3d0e">1 NIM</text>
  </g>
  <g fill="#a94f37"><path d="M338 178h8v26h-8z"/><path d="m314 189 6-6 18 18-6 6z"/><path d="m366 183 6 6-18 18-6-6z"/></g>
  <text x="360" y="356" text-anchor="middle" font-family="Iowan Old Style,Georgia,serif" font-size="25" font-weight="700" fill="#183f36">A human handoff. One accountable baton.</text>
  <text x="360" y="381" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#665c50">Confirm the person · authorize exactly 1 NIM · custody moves only after FINAL</text>
  <rect width="720" height="400" rx="18" fill="transparent" filter="url(#grain)" opacity=".18"/>
</svg>
