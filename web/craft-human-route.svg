<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="t d">
  <title id="t">A warm introduction moving through real people toward one destination</title>
  <desc id="d">A mature paper-collage travel scene with people, one yellow baton, a route line and a destination postcard.</desc>
  <defs>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".55" numOctaves="2" seed="14" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono"><feFuncA type="table" tableValues="0 .11"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="mono" mode="multiply"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#3d2e20" flood-opacity=".18"/></filter>
    <clipPath id="postcard"><path d="M433 36 716 23 728 270 447 286Z"/></clipPath>
  </defs>
  <rect width="760" height="420" rx="18" fill="#e8dcc9"/>
  <path d="M0 317c109-35 188-26 266-58 90-37 163-95 267-88 75 5 133 27 227 7v242H0Z" fill="#b9c8b4"/>
  <path d="M0 350c120-41 209-6 314-52 118-52 209-97 446-73v195H0Z" fill="#9bb5bf" opacity=".72"/>
  <g filter="url(#shadow)">
    <path d="M433 36 716 23 728 270 447 286Z" fill="#fff9ed" stroke="#6f6254" stroke-width="2"/>
    <g clip-path="url(#postcard)">
      <rect x="435" y="35" width="300" height="255" fill="#a9c8d5"/>
      <path d="M438 201c81-56 137-50 208-82 30-14 52-20 92-21v192H438Z" fill="#c6b073"/>
      <g fill="#f4e4cc" stroke="#8d6f52" stroke-width="1.4">
        <path d="M454 224v-87h46v87Z"/><path d="M503 224v-119h57v119Z"/><path d="M563 224v-96h49v96Z"/><path d="M615 224v-132h62v132Z"/><path d="M680 224v-79h38v79Z"/>
      </g>
      <g fill="#a94f37"><path d="m448 137 30-22 30 22Z"/><path d="m498 105 35-25 35 25Z"/><path d="m558 128 30-22 30 22Z"/><path d="m610 92 37-28 37 28Z"/><path d="m675 145 24-18 25 18Z"/></g>
      <g fill="#183f36" opacity=".82"><rect x="469" y="155" width="7" height="13"/><rect x="522" y="127" width="8" height="14"/><rect x="583" y="149" width="7" height="13"/><rect x="638" y="116" width="8" height="15"/></g>
      <path d="M438 233c90-36 179-26 300-61v118H438Z" fill="#7d9ea7"/>
    </g>
    <text x="469" y="310" font-family="Bradley Hand,Segoe Print,cursive" font-size="20" fill="#4b4035" transform="rotate(-3 469 310)">One destination. A real reason to get there.</text>
  </g>
  <g filter="url(#shadow)">
    <path d="M38 46 347 57 336 251 26 240Z" fill="#f8efdf" stroke="#756858" stroke-width="1.7"/>
    <text x="61" y="91" font-family="Iowan Old Style,Georgia,serif" font-size="34" font-weight="700" fill="#183f36">People open doors</text>
    <text x="61" y="127" font-family="Iowan Old Style,Georgia,serif" font-size="34" font-weight="700" fill="#183f36">for people.</text>
    <text x="61" y="166" font-family="Arial,sans-serif" font-size="14" fill="#61564a">The route exists because one person knows</text>
    <text x="61" y="187" font-family="Arial,sans-serif" font-size="14" fill="#61564a">the next trusted bridge toward the destination.</text>
    <text x="61" y="221" font-family="Bradley Hand,Segoe Print,cursive" font-size="18" fill="#8c4938">Same hands. A brighter world.</text>
  </g>
  <path d="M92 332c110-47 213-14 326-55 68-25 113-58 181-82" fill="none" stroke="#d96348" stroke-width="7" stroke-linecap="round" stroke-dasharray="12 14"/>
  <g transform="translate(91 277)" filter="url(#shadow)">
    <circle cx="33" cy="30" r="22" fill="#c18b68"/><path d="M14 25c5-26 42-27 39 1-13-8-26-8-39-1Z" fill="#2a2521"/>
    <path d="M6 105c4-47 14-61 28-61 16 0 27 14 31 61Z" fill="#6f4f72"/><path d="M19 102 12 140h15l8-37 8 37h15l-5-38Z" fill="#183f36"/>
  </g>
  <g transform="translate(254 253)" filter="url(#shadow)">
    <circle cx="33" cy="30" r="22" fill="#d0a17d"/><path d="M13 24c9-24 41-22 40 4-14-8-27-10-40-4Z" fill="#5c4335"/>
    <path d="M6 105c4-47 14-61 28-61 16 0 27 14 31 61Z" fill="#b75f47"/><path d="M19 102 12 140h15l8-37 8 37h15l-5-38Z" fill="#557d98"/>
  </g>
  <g transform="translate(407 215)" filter="url(#shadow)">
    <circle cx="33" cy="30" r="22" fill="#855a44"/><path d="M13 24c9-23 39-26 40 2-14-6-26-7-40-2Z" fill="#211f1b"/>
    <path d="M6 105c4-47 14-61 28-61 16 0 27 14 31 61Z" fill="#49756e"/><path d="M19 102 12 140h15l8-37 8 37h15l-5-38Z" fill="#735a78"/>
  </g>
  <g transform="translate(202 306) rotate(-5)" filter="url(#shadow)"><rect width="116" height="29" rx="14" fill="#e0b34f" stroke="#8c6b1c" stroke-width="2"/><text x="58" y="19" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="1" fill="#5e4810">1 NIM</text></g>
  <g transform="translate(628 125)" filter="url(#shadow)"><path d="M0 38C0 17 17 0 38 0s38 17 38 38c0 28-38 69-38 69S0 66 0 38Z" fill="#a94f37"/><circle cx="38" cy="38" r="13" fill="#fff7e7"/><circle cx="38" cy="38" r="5" fill="#a94f37"/></g>
  <rect width="760" height="420" rx="18" fill="transparent" filter="url(#grain)" opacity=".22"/>
</svg>
