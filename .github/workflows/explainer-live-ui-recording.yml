name: Explainer Live UI Recording

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/record-explainer-ui.mjs
      - .github/workflows/explainer-live-ui-recording.yml

permissions:
  contents: read

jobs:
  record:
    name: Record live production UI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NIMCARRY_EXPLAINER_URL: https://nimcarry.faadil-casecraft.workers.dev
      EXPLAINER_PLAYWRIGHT_ROOT: /tmp/nimcarry-explainer-playwright
      EXPLAINER_OUTPUT: explainer-ui-recording
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright in isolated tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$EXPLAINER_PLAYWRIGHT_ROOT"
          mkdir -p "$EXPLAINER_PLAYWRIGHT_ROOT"
          cd "$EXPLAINER_PLAYWRIGHT_ROOT"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Record live production practice flow
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$EXPLAINER_OUTPUT"

          for attempt in 1 2 3 4; do
            echo "Live recording attempt $attempt/4"
            if node scripts/record-explainer-ui.mjs "$NIMCARRY_EXPLAINER_URL"; then
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              exit 1
            fi
            echo "Runtime not ready; waiting before retry..."
            sleep 12
          done

      - name: Install ffmpeg
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      - name: Convert recording to MP4
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -y \
            -i "$EXPLAINER_OUTPUT/shots-09-21-live-practice.webm" \
            -c:v libx264 \
            -preset medium \
            -crf 18 \
            -pix_fmt yuv420p \
            -movflags +faststart \
            -an \
            "$EXPLAINER_OUTPUT/shots-09-21-live-practice.mp4"

      - name: Upload explainer recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nimcarry-explainer-ui-live-recording
          path: explainer-ui-recording
          if-no-files-found: error
          retention-days: 14
