name: Final Human Craft Visual Review

on:
  push:
    branches:
      - experiment/approved-craft-fidelity
    paths:
      - web/final-human-craft.css
      - web/final-human-craft.js
      - web/final-human-craft-max.css
      - web/final-human-craft-max.js
      - web/craft-human-route.svg
      - web/craft-baton-handoff.svg
      - web/craft-arrival.svg
      - web/nimcarry-mark.svg
      - web/favicon.svg
      - web/social-card.svg
      - web/manifest.webmanifest
      - web/index.html
      - scripts/approved-craft-visual-capture.mjs
      - .github/workflows/approved-craft-visual-review.yml
      - docs/design/APPROVED-CRAFT-FIDELITY-CONTRACT.yaml
  pull_request:
    branches:
      - experiment/mature-nimiq-pay-positioning

permissions:
  contents: read

jobs:
  final-human-craft-visual:
    name: Capture final human-craft responsive matrix
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TRACE_PLAYWRIGHT_ROOT: /tmp/final-human-craft-playwright
    steps:
      - name: Checkout final human-craft candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install Playwright in isolated tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$TRACE_PLAYWRIGHT_ROOT"
          mkdir -p "$TRACE_PLAYWRIGHT_ROOT"
          cd "$TRACE_PLAYWRIGHT_ROOT"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture mobile tablet desktop states
        shell: bash
        run: |
          set -euo pipefail
          rm -rf final-human-craft-visual
          node scripts/approved-craft-visual-capture.mjs web final-human-craft-visual 4199

      - name: Enforce geometry gate
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const report = JSON.parse(await readFile('final-human-craft-visual/report.json','utf8'));
          const failures = [];
          for (const [viewport, states] of Object.entries(report.viewports)) {
            for (const [state, data] of Object.entries(states)) {
              if (data.horizontal_overflow) failures.push(`${viewport}/${state}: horizontal overflow`);
              if (data.small_buttons.length) failures.push(`${viewport}/${state}: touch targets ${JSON.stringify(data.small_buttons)}`);
            }
          }
          if (failures.length) {
            console.error(failures.join('\n'));
            process.exit(1);
          }
          console.log('Final human-craft geometry gate PASS');
          NODE

      - name: Upload final human-craft matrix
        uses: actions/upload-artifact@v4
        with:
          name: final-human-craft-matrix
          path: final-human-craft-visual
          if-no-files-found: error
          retention-days: 7
