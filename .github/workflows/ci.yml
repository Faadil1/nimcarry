name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Public-repo secret scan
        run: node scripts/secret-scan.mjs

      - name: Browser JavaScript syntax
        run: for f in web/app.js web/nc-ui.js web/nimiq-provider.js web/http-compat.js web/invitation-resume.js web/nimiq-recovery-ux.js web/nimiq-submission-guard.js web/network-label-guard.js web/route-access-recovery.js web/user-profile.js web/usage-evidence.js web/testnet-preflight.js web/payment-identity-diagnostic.js; do node --check "$f"; done

      - name: Cloudflare runtime syntax and config
        run: node --check cloudflare/worker.mjs && node -e "JSON.parse(require('fs').readFileSync('cloudflare/wrangler.jsonc','utf8'))"

      - name: Install pinned Cloudflare deployment toolchain
        run: npm install --prefix cloudflare --no-audit --no-fund

      - name: Cloudflare Wrangler dry run
        run: npm --prefix cloudflare run deploy:dry-run

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Cloudflare container image build
        run: docker build -f Dockerfile.cloudflare -t nimcarry-cloudflare-ci .
