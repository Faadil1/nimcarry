name: TRACE Visual Review

on:
  push:
    branches:
      - experiment/trace-winner-convergence
    paths:
      - scripts/trace-visual-capture.mjs
      - web/trace-winner-convergence.css
      - web/trace-winner-convergence.js
      - web/index.html
      - .github/workflows/trace-visual-review.yml

permissions:
  contents: read

jobs:
  visual-matrix:
    name: Capture main + A/B/C/D + convergence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TRACE_PLAYWRIGHT_ROOT: /tmp/trace-playwright

    steps:
      - name: Checkout convergence tooling and all refs
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: experiment/trace-winner-convergence

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install Playwright in isolated visual-review tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$TRACE_PLAYWRIGHT_ROOT"
          mkdir -p "$TRACE_PLAYWRIGHT_ROOT"
          cd "$TRACE_PLAYWRIGHT_ROOT"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture deterministic demo states for every direction
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p trace-visual
          declare -a specs=(
            "main:origin/main"
            "A:origin/experiment/fable-51-mobile-ui"
            "B:origin/experiment/trace-human-relay"
            "C:origin/experiment/trace-living-route"
            "D:origin/experiment/trace-proof-object"
            "convergence:HEAD"
          )
          port=4173
          for spec in "${specs[@]}"; do
            label="${spec%%:*}"
            ref="${spec#*:}"
            work="/tmp/nimcarry-${label}"
            rm -rf "$work"
            git worktree add --detach "$work" "$ref"
            node scripts/trace-visual-capture.mjs "$work/web" "$label" "trace-visual/$label" "$port"
            git worktree remove "$work" --force
            port=$((port + 1))
          done

      - name: Build compact matrix report
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const labels = ['main','A','B','C','D','convergence'];
          const summary = { generated_at: new Date().toISOString(), candidates: {} };
          for (const label of labels) {
            const report = JSON.parse(await readFile(`trace-visual/${label}/report.json`, 'utf8'));
            const rows = [];
            for (const [viewport, states] of Object.entries(report.viewports)) {
              for (const [state, data] of Object.entries(states)) {
                rows.push({
                  viewport,
                  state,
                  horizontal_overflow: data.horizontal_overflow,
                  overflow_count: data.overflow_elements.length,
                  small_button_count: data.small_buttons.length,
                  first_view_text: data.first_view_text
                });
              }
            }
            summary.candidates[label] = rows;
          }
          await writeFile('trace-visual/matrix.json', JSON.stringify(summary, null, 2));
          console.log(JSON.stringify(summary, null, 2));
          NODE

      - name: Upload TRACE visual matrix
        uses: actions/upload-artifact@v4
        with:
          name: trace-visual-matrix
          path: trace-visual
          if-no-files-found: error
          retention-days: 7
